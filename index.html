<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>왜 클릭?</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 24px 16px;
    background: #fff;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  img {
    width: 100%;
    max-width: 520px;
    height: auto;
    display: block;
  }
  h1 {
    font-size: clamp(56px, 14vw, 120px);
    font-weight: 900;
    color: #111;
    letter-spacing: -0.03em;
    text-align: center;
  }

<body>
  <!-- 아래 src에 사진 주소를 넣으세요 -->
  <img src="seal.jpg" alt="아기 물범">

</html>
